<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Study Planner</title>
</head>
<body>
  <h1>Study Planner</h1>

  <section id="login-section">
    <h2>Sign in</h2>
    <form id="login-form">
      <input id="email" type="email" placeholder="Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <section id="dashboard-section" hidden>
    <h2>Assignment Dashboard</h2>
    <p id="profile"></p>

    <form id="assignment-form">
        <input id="module-code" placeholder="Module code" value="COM6036">
        <input id="module-title" placeholder="Module title" value="Digital Innovation">
        <input id="module-leader" placeholder="Module leader">
        <input id="assignment-type" placeholder="Assignment type">
        <input id="assignment-weighting" type="number" step="0.01" placeholder="Assignment weighting">
    
        <label>
            Official deadline
            <input id="official-deadline" type="date">
        </label>
    
        <label>
            Personal target date
            <input id="personal-target-date" type="date">
        </label>
    
        <textarea id="assignment-task" placeholder="Assignment task"></textarea>
        <textarea id="assessment-criteria" placeholder="Assessment criteria"></textarea>
        <textarea id="learning-outcomes-ksbs" placeholder="Learning outcomes / KSBs"></textarea>
        <textarea id="referencing-guidance" placeholder="Referencing guidance"></textarea>
        <textarea id="personal-assignment-goal" placeholder="Personal assignment goal"></textarea>
    
        <button type="submit">Create assignment</button>
    </form>

    <h3>Your assignments</h3>
    <button id="load-assignments-button">Refresh assignments</button>
    <ul id="assignment-list"></ul>
    <section id="assignment-detail-section" hidden>
        <h3>Assignment details</h3>
        <div id="assignment-detail"></div>
        <button id="delete-assignment-button" type="button">Delete assignment</button>
    </section>
  </section>

  <pre id="output"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js"></script>
</body>
</html>
