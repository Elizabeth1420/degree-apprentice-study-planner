<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Study Planner</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main>
    <h1>Study Planner</h1>

    <section id="login-section">
      <h2>Sign in</h2>
      <form id="login-form">
        <input id="email" type="email" placeholder="Email" required>
        <input id="password" type="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
      </form>
    </section>

    <section id="dashboard-section" hidden>
      <h2>Assignment Dashboard</h2>
      <p id="profile"></p>

      <form id="assignment-form">
        <input id="module-code" placeholder="Module code" value="COM6036">
        <input id="module-title" placeholder="Module title" value="Digital Innovation">
        <input id="module-leader" placeholder="Module leader">
        <input id="assignment-type" placeholder="Assignment type">
        <input id="assignment-weighting" type="number" step="0.01" placeholder="Assignment weighting">

        <label>
          Official deadline
          <input id="official-deadline" type="date">
        </label>

        <label>
          Personal target date
          <input id="personal-target-date" type="date">
        </label>

        <textarea id="assignment-task" placeholder="Assignment task"></textarea>
        <textarea id="assessment-criteria" placeholder="Assessment criteria"></textarea>
        <textarea id="learning-outcomes-ksbs" placeholder="Learning outcomes / KSBs"></textarea>
        <textarea id="referencing-guidance" placeholder="Referencing guidance"></textarea>
        <textarea id="personal-assignment-goal" placeholder="Personal assignment goal"></textarea>

        <button type="submit">Create assignment</button>
      </form>

      <h3>Your assignments</h3>
      <button id="load-assignments-button">Refresh assignments</button>
      <ul id="assignment-list"></ul>
      <section id="assignment-detail-section" hidden>
        <h3>Assignment details</h3>
        <div id="assignment-detail"></div>

        <h3>Edit assignment details</h3>
        <form id="edit-assignment-form">
          <input id="edit-module-code" placeholder="Module code">
          <input id="edit-module-title" placeholder="Module title">
          <input id="edit-module-leader" placeholder="Module leader">
          <input id="edit-assignment-type" placeholder="Assignment type">
          <input id="edit-assignment-weighting" type="number" step="0.01" placeholder="Assignment weighting">

          <label>
            Official deadline
            <input id="edit-official-deadline" type="date">
          </label>

          <label>
            Personal target date
            <input id="edit-personal-target-date" type="date">
          </label>

          <textarea id="edit-assignment-task" placeholder="Assignment task"></textarea>
          <textarea id="edit-assessment-criteria" placeholder="Assessment criteria"></textarea>
          <textarea id="edit-learning-outcomes-ksbs" placeholder="Learning outcomes / KSBs"></textarea>
          <textarea id="edit-referencing-guidance" placeholder="Referencing guidance"></textarea>
          <textarea id="edit-personal-assignment-goal" placeholder="Personal assignment goal"></textarea>

          <button type="submit">Save assignment details</button>
        </form>

        <h3>Progress</h3>
        <div id="progress-summary"></div>

        <h3>Requirements</h3>
        <button id="generate-requirements-button" type="button">Generate requirements</button>
        <ul id="requirements-list"></ul>

        <h3>Tasks</h3>
        <button id="generate-tasks-button" type="button">Generate tasks</button>

        <form id="manual-task-form">
          <input id="manual-task-title" placeholder="Manual task title" required>
          <textarea id="manual-task-description" placeholder="Manual task description"></textarea>
          <button type="submit">Add manual task</button>
        </form>
        <ul id="tasks-list"></ul>

        <h3>Study sessions</h3>
        <form id="study-session-form">
          <input id="session-name" placeholder="Session name">
          <input id="session-date" type="date" required>
          <textarea id="session-goal" placeholder="Session goal"></textarea>
          <button type="submit">Create study session</button>
        </form>
        <ul id="study-session-list"></ul>

        <h3>Study history</h3>
        <div id="study-history"></div>

        <h3>Assignment brief text</h3>
        <textarea id="brief-text" placeholder="Paste assignment brief text here"></textarea>
        <button id="save-brief-text-button" type="button">Save brief text</button>

        <h3>Assignment brief file</h3>
        <input id="brief-file" type="file" accept=".pdf,.docx">
        <button id="upload-brief-file-button" type="button">Upload brief file</button>
        <button id="delete-assignment-button" type="button">Delete assignment</button>
      </section>
    </section>
  </main>

  <pre id="output"></pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/app.js"></script>
</body>

</html>
